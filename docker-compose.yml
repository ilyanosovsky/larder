services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: larder
      POSTGRES_USER: postgres
      # Local-dev default; override via POSTGRES_PASSWORD in the shell or an
      # env file, and keep DATABASE_URL in sync when you do.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Bound to loopback only — never exposed to the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - larder-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d larder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  larder-postgres-data:
