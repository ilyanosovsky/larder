name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The app is bootstrapped in Phase 0.1 (see IMPLEMENTATION_PLAN.md).
      # Until package.json exists, the check passes on docs-only changes so
      # the required "CI" status never blocks documentation PRs.
      - name: Detect app
        id: app
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet — docs-only repo, skipping app checks."
          fi

      - name: Setup pnpm
        if: steps.app.outputs.exists == 'true'
        uses: pnpm/action-setup@v4
        with:
          # Keep in sync with the "packageManager" field in package.json.
          version: 10

      - name: Setup Node
        if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        if: steps.app.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.app.outputs.exists == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.app.outputs.exists == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.app.outputs.exists == 'true'
        run: pnpm test

      - name: Build
        if: steps.app.outputs.exists == 'true'
        run: pnpm build
